name: Check for GitHub Actions updates

on:
    push:
    schedule:
        # Runs at 04:00 UTC on Mondays and Wednesday
        -   cron: "0 4 * * 1"

# a new push to the same PR or branch cancels the run it makes obsolete; main keeps a run per commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gha-updates:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check action updates
      uses: rahulinux/gh-check-action@v1.0.0
