name: wasm_tests.yml
on: [push, pull_request]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # the version is derived from git describe, so tags must be present
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        allow-prereleases: true
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
    - name: Build wheel
      run: |
        python -m build --wheel
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: speasy-wheel
        path: dist/*.whl

  test:
    needs: build-wheel
    runs-on: ubuntu-latest
    env:
        DISPLAY: :99
        FORCE_COLOR: 3
    steps:
    - uses: actions/checkout@v7
      with:
        # the version is derived from git describe, so tags must be present
        fetch-depth: 0
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        allow-prereleases: true
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Download pyodide distribution
      uses: pyodide/pyodide-actions/download-pyodide@012fa537869d343726d01863a34b773fc4d96a14 # v2
      with:
        version: '314.0.7'
        to: pyodide-dist


    - name: restore speasy wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: speasy-wheel
        path: pyodide-dist/


    - name: Install browser for selenium tests
      uses: pyodide/pyodide-actions/install-browser@0876419b7ac412db2b84e86499bc95ff3b64b004
      with:
        runner: selenium
        browser: chrome
        # 'latest' means the newest *Chromium snapshot*, not the newest stable Chrome, and
        # left chromedriver several majors ahead of the Chrome the runner image ships
        browser-version: stable

    - name: Point the runner's system Chrome at the one chromedriver matches
      # install-browser symlinks /usr/bin/google-chrome and /usr/bin/chromedriver at the
      # Chrome it installed, but the runner image ships another Chrome at
      # /opt/google/chrome/chrome, and that is the binary Selenium Manager resolves --
      # leaving chromedriver refusing a browser a major or more off. Point that path at the
      # same binary so both resolutions agree whatever the runner image happens to ship.
      run: sudo ln -sf "$(readlink -f /usr/bin/google-chrome)" /opt/google/chrome/chrome

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true

    - name: Install the locked test runner (pytest-pyodide, pyodide-py)
      run: uv sync --locked --only-group wasm --python 3.14

    - name: Run tests
      run: |
        uv run --locked --only-group wasm --python 3.14 python -m pytest -vra \
          --dist-dir=./pyodide-dist/ \
          --runner=selenium \
          --rt=chrome \
          tests/test_wasm.py




