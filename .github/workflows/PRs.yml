name: PR Tests

on: [pull_request]

jobs:
  build:
    env:
      SPEASY_AMDA_USERNAME: ${{ secrets.SPEASY_AMDA_USERNAME }}
      SPEASY_AMDA_PASSWORD: ${{ secrets.SPEASY_AMDA_PASSWORD }}
      SPEASY_CORE_DISABLED_PROVIDERS: "cdpp3dview"

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Give Windows the same TCP connect patience as Linux
      if: runner.os == 'Windows'
      shell: pwsh
      # Windows abandons an unanswered TCP connect far sooner than the other
      # platforms, whatever timeout the application asked for. Measured on these
      # runners by timing a connect to a blackholed address:
      #
      #   MaxSynRetransmissions = 2   ->    7.0 s
      #   MaxSynRetransmissions = 4   ->   21.0 s   (what the runners ship)
      #   MaxSynRetransmissions = 6   ->  123.0 s
      #   MaxSynRetransmissions = 8   ->  >150 s
      #   MaxSynRetransmissions = 10  ->  rejected, "the parameter is incorrect"
      #
      # against macOS at 75.0 s and Linux at 135.5 s. Only Windows quits inside
      # speasy's own 60 s timeout, which is why network tests fail there and not
      # elsewhere. 6 puts the ceiling at 123 s -- past the 60 s budget with room,
      # next to Linux, and clear of the values the stack refuses.
      #
      # Do not trust the published 3s-doubling arithmetic here: it predicts 21 s
      # at 2 (measured 7) and 31 s at 4 (measured 21). These numbers are measured.
      run: |
        foreach ($s in Get-NetTCPSetting | Where-Object { $_.SettingName -ne 'Automatic' }) {
          Set-NetTCPSetting -SettingName $s.SettingName -MaxSynRetransmissions 6
        }
        $applied = (Get-NetTCPSetting -SettingName InternetCustom).MaxSynRetransmissions
        if ($applied -ne 6) { throw "MaxSynRetransmissions is $applied, expected 6" }
        Write-Host "MaxSynRetransmissions = $applied (connect ceiling ~123s)"
    - name: add test logins
      uses: extractions/netrc@v3
      with:
        machine: authenticationtest.com
        username: user
        password: pass
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --group dev --group docs
    - name: Lint with flake8
      run: |
        uv run --no-project --no-build --with flake8 flake8 speasy tests --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run --no-project --no-build --with flake8 flake8 speasy tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      if: matrix.python-version != '3.10' ||  matrix.os != 'ubuntu-latest'
      env:
          SPEASY_CORE_HTTP_REWRITE_RULES: '{"https://thisserver_does_not_exists.lpp.polytechnique.fr/pub/":"http://sciqlop.lpp.polytechnique.fr/cdaweb-data/pub/"}'
      run: uv run --locked pytest
    - name: Test with pytest (coverage + long tests)
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      env:
        SPEASY_AMDA_MAX_CHUNK_SIZE_DAYS: "25"
        SPEASY_LONG_TESTS: ""
        SPEASY_INVENTORY_TESTS: ""
        SPEASY_CORE_HTTP_REWRITE_RULES: '{"https://thisserver_does_not_exists.lpp.polytechnique.fr/pub/":"http://sciqlop.lpp.polytechnique.fr/cdaweb-data/pub/"}'
        SPEASY_CORE_HTTP_USER_AGENT: "speasy-test-github-actions"
        SPEASY_CORE_DISABLED_PROVIDERS: ""
      run: |
        sudo apt update && sudo apt install -y texlive pandoc
        uv run --locked pytest --cov=./ -cov-config=.coveragerc --cov-report=xml
        make doctest
    - name: Check that release process is not broken
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      run: |
        uv run --locked --with build --with wheel --with twine python -m build .
        uv run --no-project --no-build --with twine twine check dist/*
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
