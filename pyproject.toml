[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning>=0.7"]

[project]
name = 'speasy'
dynamic = ["version"]
description = "A simple Python package to deal with main Space Physics WebServices (CDA, CSA, AMDA and SSC)."
keywords = ["satellite", "plasma-physics", "nasa-data", "amda", "cdpp", "CDF"]
authors = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]

maintainers = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]

requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = ['PyYAML',
 'appdirs',
 'astropy',
 'astroquery',
 'diskcache',
 'pysciqlop-cache>=0.1.5; sys_platform != "emscripten"',
 'humanize',
 'matplotlib',
 'numpy',
 'packaging',
 'pandas',
 'pyistp>=0.8.2',
 'python-dateutil',
 'requests',
 'scipy',
 'tqdm',
 'urllib3>=1.26.0',
 'certifi',
 'pysocks'
]


[project.urls]
homepage = "https://github.com/SciQLop/speasy"

[project.optional-dependencies]
zstd = ["pyzstd"]

[dependency-groups]
dev = [
    "ddt",
    "pytest",
    "pytest-cov",
    "pyzstd",
    "watchdog",
    "IPython",
    "cogapp",
]
docs = [
    "sphinx!=5.2.0.post0",
    "sphinx-rtd-theme",
    "argh",
    "numpydoc",
    "sphinx-gallery",
    "nbsphinx",
    "ipympl",
    "ipywidgets",
    "sphinx-codeautolink==0.15.2",
    "sphinxcontrib-apidoc",
    "pandoc",
]

[tool.ruff.lint]
select = ["NPY201"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["speasy"]

[tool.uv-dynamic-versioning]
# The version comes from `git describe`, so between releases it reports what it
# actually is -- 1.8.0.dev7+g85c9152 -- instead of repeating the last release.
#
# `bump` is deliberately left off. A dev cycle is opened by tagging
# vX.Y.0.dev0, and on a pre-release base dunamai's bump increments the dev
# revision, so distance 2 would report .dev3. With bump off the dev number is
# the commit distance, which is what it should be. If the release workflow ever
# changes to tagging finals only, bump must be turned back on or commits after
# a release read 1.8.0.post2.dev0.
